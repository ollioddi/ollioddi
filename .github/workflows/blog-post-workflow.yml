name: Latest blog post workflow
on:
  schedule:
    # Runs every hour
    - cron: '0 * * * *'
  workflow_dispatch:  # Manual trigger
jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: 'https://ollioddi.dev/rss.xml'
          user_agent: 'Mozilla/5.0 (compatible; BlogPostBot/1.0; +https://github.com/ollioddi/ollioddi)'
          accept_header: 'application/rss+xml, application/xml, text/xml'
          max_post_count: 5
          date_format: 'dd mmm yyyy'
          disable_html_encoding: true
          template: '#### [$title]($url)$newline<sub>📅 $date &nbsp;·&nbsp; 🏷️ $categories</sub>$newline$newline> $description$newline$newline'
